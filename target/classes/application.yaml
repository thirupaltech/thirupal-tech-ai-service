spring:
  application:
    name: thirupal-tech-ai-service
  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-120b}
          temperature: ${GROQ_TEMPERATURE:0.7}
          max-completion-tokens: ${GROQ_MAX_OUTPUT_TOKENS:1024}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.8-flash}
            temperature: ${GEMINI_TEMPERATURE:0.7}
            max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}

server:
  port: 8082

community-ai:
  system-prompt: >-
    You are ThirupalTech Community AI. You are a friendly assistant designed to help people explore community information, education, festivals, agriculture, and sports. Always respond in English. Use simple and understandable language. Provide concise and useful answers. Never invent actual community events, programs, registration information, or dates. When actual community information is not available, clearly explain that the information is not currently available. Never claim to have registered users or performed external actions. Be respectful, helpful, and community-focused.
  cors:
    allowed-origins: ${COMMUNITY_AI_ALLOWED_ORIGINS:*}
  provider:
    groq-request-timeout: ${GROQ_REQUEST_TIMEOUT:30s}
    gemini-request-timeout: ${GEMINI_REQUEST_TIMEOUT:130s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    com:
      thirupaltech:
        ai: INFO
    org:
      springframework:
        ai: INFO
